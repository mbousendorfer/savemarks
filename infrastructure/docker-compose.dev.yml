services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: savemarks
      POSTGRES_USER: savemarks
      POSTGRES_PASSWORD: savemarks
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./.data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savemarks"]
      interval: 5s
      timeout: 5s
      retries: 10
