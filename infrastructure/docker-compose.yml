services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savemarks}
      POSTGRES_USER: ${POSTGRES_USER:-savemarks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-/data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savemarks}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${SAVEMARKS_IMAGE:-ghcr.io/mbousendorfer/savemarks:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-savemarks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-savemarks}
      SAVEMARKS_TOKEN_PEPPER: ${SAVEMARKS_TOKEN_PEPPER:?set SAVEMARKS_TOKEN_PEPPER}
      SAVEMARKS_WEB_USERNAME: ${SAVEMARKS_WEB_USERNAME:-savemarks}
      SAVEMARKS_WEB_PASSWORD: ${SAVEMARKS_WEB_PASSWORD:?set SAVEMARKS_WEB_PASSWORD}
      SAVEMARKS_BASE_URL: ${SAVEMARKS_BASE_URL:-http://localhost:3210}
      SAVEMARKS_ALLOWED_EXTENSION_IDS: ${SAVEMARKS_ALLOWED_EXTENSION_IDS:-}
      SAVEMARKS_DEV_ORIGINS: ${SAVEMARKS_DEV_ORIGINS:-}
      MEDIA_DATA_PATH: /data/media
      BACKUP_DATA_PATH: /data/backups
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      PORT: 3210
    ports:
      - "${SAVEMARKS_PORT:-3210}:3210"
    volumes:
      - ${SAVEMARKS_DATA_PATH:-/mnt/user/appdata/savemarks/data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 256
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3210/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
