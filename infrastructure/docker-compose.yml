services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savemarks}
      POSTGRES_USER: ${POSTGRES_USER:-savemarks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-/data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savemarks}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-savemarks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-savemarks}
      SAVEMARKS_TOKEN_PEPPER: ${SAVEMARKS_TOKEN_PEPPER:?set SAVEMARKS_TOKEN_PEPPER}
      SAVEMARKS_ALLOWED_EXTENSION_IDS: ${SAVEMARKS_ALLOWED_EXTENSION_IDS:-}
      SAVEMARKS_DEV_ORIGINS: ${SAVEMARKS_DEV_ORIGINS:-}
      MEDIA_DATA_PATH: /data/media
      BACKUP_DATA_PATH: /data/backups
      PORT: 3210
    ports:
      - "${SAVEMARKS_PORT:-3210}:3210"
    volumes:
      - ${MEDIA_DATA_PATH:-/data/media}:/data/media
      - ${BACKUP_DATA_PATH:-/data/backups}:/data/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3210/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
